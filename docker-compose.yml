services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data:ro
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_NOWCAST_API_URL: ${VITE_NOWCAST_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:80"
    depends_on:
      - backend
